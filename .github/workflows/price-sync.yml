name: PricePulse Retail Price Sync (Takealot & JD Group)

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target D1 environment'
        required: true
        default: 'remote'
        type: choice
        options:
          - remote
          - local

jobs:
  sync:
    name: Sync Retail Offers & Invalidate Edge Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20 & Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Cloudflare Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret. Sync cannot proceed."
            exit 1
          fi

      - name: Run Direct API Retailer Sync (Takealot, Incredible, HiFi Corp)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd backend
          python scrapers/sync_prices.py --all --fast

      - name: Invalidate Edge KV Cache
        if: success()
        env:
          ADMIN_PURGE_TOKEN: ${{ secrets.ADMIN_PURGE_TOKEN }}
        run: |
          if [ -n "$ADMIN_PURGE_TOKEN" ]; then
            curl -s -X POST https://pricepulse-backend.pricepulse-sa.workers.dev/api/cache/purge \
              -H "Authorization: Bearer $ADMIN_PURGE_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"scope": "all"}'
            echo "Edge catalog KV cache purged successfully."
          else
            echo "ADMIN_PURGE_TOKEN not provided; skipping cache purge."
          fi
